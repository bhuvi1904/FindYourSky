version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: skymatch-postgres
    restart: always
    environment:
      POSTGRES_USER: skymatch_user
      POSTGRES_PASSWORD: skymatch_password
      POSTGRES_DB: skymatch_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skymatch_user -d skymatch_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: skymatch-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://skymatch_user:skymatch_password@db:5432/skymatch_db
      ALLOWED_HOSTS: http://localhost:80,http://localhost:5173,http://localhost:3000,http://127.0.0.1
      DEBUG: "false"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skymatch-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
